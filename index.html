<style>
:root{--brand:#274189;--brand-2:#1D3270;--brand-50:#EEF2FB;--brand-100:#DCE4F7;--side:#0D1830;--side-2:#14213F;--ink:#0F172A;--ink-2:#334155;--sub:#64748B;--line:#E4E8F0;--line-2:#CBD3E1;--ground:#F5F7FB;--paper:#FFFFFF;
 --ok:#0F7B4D;--ok-bg:#E3F5EC;--warn:#A15C07;--warn-bg:#FDF1DC;--bad:#B42318;--bad-bg:#FDECEA;--info:#2B4CB0;--info-bg:#EAF0FD;--muted-bg:#EEF1F6;
 --r:8px;--font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}body{background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}h1{font-size:1.45rem;font-weight:700;letter-spacing:-.015em}h2{font-size:.98rem;font-weight:650}h3{font-size:.86rem;font-weight:650;margin:14px 0 6px;color:var(--ink-2)}
.ic{width:18px;height:18px;fill:currentColor;flex:0 0 18px}.sr{position:absolute;left:-9999px}.muted{color:var(--sub)}.sm{font-size:.82rem}.pos{color:var(--ok)}.neg{color:var(--bad)}.late{color:var(--bad);font-weight:600}.grow{flex:1}
kbd{font:600 .72rem/1 var(--font);background:var(--muted-bg);border:1px solid var(--line-2);border-radius:4px;padding:2px 5px}
/* shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.shell.col{grid-template-columns:64px minmax(0,1fr)}
.side{background:linear-gradient(180deg,var(--side),var(--side-2));color:#B8C4DC;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}.brand img{height:34px;background:#fff;border-radius:5px;padding:3px 5px}.brand span{color:#fff;font-weight:700;letter-spacing:.06em;font-size:.8rem}
.side nav{flex:1;overflow-y:auto;padding:4px 8px 10px;scrollbar-width:thin}.ng{margin-top:10px}.ngl{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:#6E7FA3;padding:6px 10px 4px;text-transform:uppercase}
.side nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:#C3CDE2;text-decoration:none;font-weight:500;white-space:nowrap;position:relative}
.side nav a:hover{background:rgba(255,255,255,.06);color:#fff}.side nav a.on{background:rgba(120,150,230,.18);color:#fff}.side nav a.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:#8FB0FF}
.side nav a em{margin-left:auto;background:#E5484D;color:#fff;font-style:normal;font-size:.7rem;font-weight:700;border-radius:9px;padding:0 6px}
.collapse{display:flex;align-items:center;gap:10px;margin:8px;padding:8px 10px;border:0;border-radius:6px;background:rgba(255,255,255,.05);color:#9AA9C8;cursor:pointer}.collapse .ic{transform:rotate(180deg)}
.shell.col .side nav a span,.shell.col .ngl,.shell.col .brand span,.shell.col .collapse span{display:none}.shell.col .collapse .ic{transform:none}.shell.col .side nav a{justify-content:center}.shell.col .brand img{height:24px}
.help{margin:10px;padding:12px;border-radius:8px;background:rgba(255,255,255,.07);font-size:.82rem}.help a{color:#fff;font-weight:600;text-decoration:none}
.body{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 22px;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.gsbtn{display:flex;align-items:center;gap:8px;min-width:min(420px,50vw);padding:7px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--paper);color:var(--sub);cursor:pointer;text-align:left}.gsbtn span{flex:1}
.pname{font-weight:700}.demo-b{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:3px 7px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:7px;background:transparent;cursor:pointer;color:var(--ink-2);position:relative}.icon-btn:hover{background:var(--muted-bg)}.icon-btn em{position:absolute;top:2px;right:1px;min-width:16px;height:16px;border-radius:8px;background:#E5484D;color:#fff;font:700 .64rem/16px var(--font);font-style:normal;padding:0 4px}
.mnav{display:none}.bellw{position:relative}.bellm{position:absolute;right:0;top:40px;width:340px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -18px rgba(15,23,42,.35);padding:6px;z-index:40}
.bellm .bh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px}.bellm a{display:block;padding:8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:.86rem}.bellm a:hover{background:var(--ground)}.bellm a.unread{font-weight:600}.bellm a small{display:block;color:var(--sub);font-weight:400}.bellm .all{text-align:center;color:var(--brand);font-weight:600}
.um{position:relative}.um summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 6px;border-radius:8px}.um summary::-webkit-details-marker{display:none}.av{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.78rem}.umn b{display:block;font-size:.84rem}.umn small{color:var(--sub);font-size:.74rem}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 30px -14px rgba(15,23,42,.3);padding:6px;min-width:200px;z-index:40}.menu button,.menu label{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;font-size:.86rem}.menu button:hover,.menu label:hover{background:var(--ground)}
main{padding:20px 24px 48px;outline:none;max-width:1600px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}.ph-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sub{color:var(--sub);margin:4px 0 0;font-size:.86rem}
.crumbs{font-size:.78rem;color:var(--sub);margin-bottom:4px}.crumbs a{color:var(--sub);text-decoration:none}.crumbs a:hover{color:var(--brand)}.crumbs i{font-style:normal;margin:0 6px;color:var(--line-2)}
.tag{font-size:.74rem;font-weight:700;color:var(--brand);letter-spacing:.03em;margin-left:6px;vertical-align:middle}
/* cards, kpis, grids */

<script>
/* ===================== POP OS · core: utils, data model, engines (business logic kept out of the UI) ===================== */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const F0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0}),F2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=(n,d)=>n==null||!isFinite(n)?'–':(n<0?'-':'')+'$'+(d?F2:F0).format(Math.abs(n));
const kmoney=n=>!isFinite(n)?'–':Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e4?'$'+(n/1e3).toFixed(0)+'K':money(n);
const pct=(n,d=1)=>!isFinite(n)?'–':(n*100).toFixed(d)+'%';
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const TODAY=(()=>{const d=new Date();d.setHours(12,0,0,0);return d;})();
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);};
const todayISO=iso(TODAY);
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fdate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}):'–';
const sdate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'–';
const ago=ts=>{const s=(Date.now()-new Date(ts))/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago';};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- configuration (all editable in Administration) ---------- */
const STAGES=['New','Contacted','Application','Documents','Underwriting','Approved','Offer Sent','Contract','Funded','Declined'];
const FUND_STEPS=['Approved','Contract Sent','Contract Signed','Verification','Funding Pending','Funding Submitted','Funded'];
const TERMS=[3,6,9,12,15,18,24];
const PPY={daily:252,weekly:52,monthly:12},PER={daily:1,weekly:5,monthly:21};
const ROLES={
 admin:{label:'Admin',areas:'*'},
 executive:{label:'Executive',areas:['overview','origination','portfolio','relationships','operations','analytics','admin:read']},
 underwriter:{label:'Underwriter',areas:['overview','applications','underwriting','offers','documents','merchants','tasks','communications','pipeline']},
 sales:{label:'Sales',areas:['overview','leads','merchants','applications','pipeline','tasks','communications','contacts','offers']},
 operations:{label:'Operations',areas:['overview','contracts','funding','documents','servicing','merchants','tasks','capital','payments']},
 collections:{label:'Collections',areas:['overview','servicing','payments','collections','renewals','merchants','tasks','communications']}
};
const DEFAULT_SETTINGS={
 company:'POP Funding Inc.',
 limits:{base:8,adb:0.5,ceil:12},
 basePrice:{3:9.0,6:15.6,9:22.4,12:24.7,15:28.9,18:39.9,24:43.5},
 tierAdj:{A:-3,B:0,C:3,D:6,E:9},
 tierCut:{A:740,B:680,C:620,D:560},
 weights:{tib:60,revenue:60,cash:50,negDays:5,nsf:8,positions:25,industry:30,trend:30,volatility:40},
 renewal:{minPaid:0.5,cleanDays:30},
 collections:['Day 1: automatic retry and reminder text','Day 3: call the owner','Day 7: formal notice email','Day 15: payment plan offer','Day 30: escalate to default review'],
 products:[{id:'wc',name:'Working Capital',kind:'Revenue-based advance',terms:[3,6,9,12,15,18],freqs:['daily','weekly'],active:true},
           {id:'tf',name:'Term Financing',kind:'Fixed-term financing',terms:[6,9,12,15,18,24],freqs:['weekly','monthly'],active:true},
           {id:'bl',name:'Business Line',kind:'Revolving line',terms:[6,12],freqs:['weekly'],active:true}],
 integrations:{email:false,sms:false,bank:false,esign:false,ach:false}
};
const INDUSTRY={'Restaurant':'H','Construction':'M','Trucking':'M','Retail':'M','Medical':'L','Auto Repair':'M','Landscaping':'M','Salon':'H','Fitness':'H','Professional Services':'L','Manufacturing':'L','E-commerce':'M','HVAC':'L','Plumbing':'L','Cleaning':'M'};
const NAICS={'Restaurant':'722511','Construction':'236220','Trucking':'484121','Retail':'448140','Medical':'621111','Auto Repair':'811111','Landscaping':'561730','Salon':'812112','Fitness':'713940','Professional Services':'541611','Manufacturing':'332710','E-commerce':'454110','HVAC':'238220','Plumbing':'238220','Cleaning':'561720'};

/* ---------- store: one source of truth + audit trail on every change ---------- */
const KEY='pop_os_v2',SKEY='pop_os_session_v2';
let DB=null;
const Store={
 load(){try{DB=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){DB=null;}if(!DB||DB.v!==2){DB=Seed.build();Store.save();}},
 save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){UI&&UI.toast('Storage is full on this device','error');}},
 get(t,id){return DB[t].find(x=>x.id===id);},
 audit(action,record,prev,next,extra){DB.audit.unshift({id:uid('a'),ts:new Date().toISOString(),user:App.user?App.user.name:'System',role:App.user?App.user.role:'system',action,record:record||'',prev:prev??'',next:next??'',extra:extra||''});if(DB.audit.length>3000)DB.audit.length=3000;},
 update(t,id,changes,label){const r=Store.get(t,id);if(!r)return;Object.keys(changes).forEach(k=>{const pv=r[k],nv=changes[k];if(JSON.stringify(pv)!==JSON.stringify(nv)){r[k]=nv;if(typeof nv!=='object')Store.audit((label||'Updated')+' '+k,recLabel(t,r),pv,nv);}});Store.save();},
 add(t,obj,label){DB[t].unshift(obj);Store.audit(label||('Created '+t.replace(/s$/,'')),recLabel(t,obj),'','created');Store.save();return obj;},
 remove(t,id,label){const r=Store.get(t,id);DB[t]=DB[t].filter(x=>x.id!==id);Store.audit(label||'Deleted',recLabel(t,r),'deleted','');Store.save();},
 event(merchantId,kind,text,meta){DB.events.unshift({id:uid('e'),merchantId,kind,text,ts:new Date().toISOString(),user:App.user?App.user.name:'System',meta:meta||null});},
 notify(text,link,roles){DB.notifications.unshift({id:uid('n'),text,link:link||'',ts:new Date().toISOString(),read:false,roles:roles||null});}
};
function recLabel(t,r){if(!r)return t;const m=r.merchantId&&Store.get('merchants',r.merchantId);return t==='applications'?r.id+' · '+(m?m.dba:''):t==='deals'?r.id+' · '+(m?m.dba:''):(r.dba||r.name||r.company||r.title||r.id);}

/* ---------- engines ---------- */
const Engine={
 nPay:(T,f)=>f==='daily'?T*21:f==='monthly'?T:Math.round(T*52/12),
 solve(pv,pm,n){if(!(pv>0&&pm>0&&n>0)||pm*n<=pv*(1+1e-12))return 0;let lo=1e-12,hi=1;for(let i=0;i<200;i++){const m=(lo+hi)/2,v=pm*(1-Math.pow(1+m,-n))/m;v>pv?lo=m:hi=m;}return(lo+hi)/2;},
 factor(tier,T){const s=DB.settings,c=(s.basePrice[T]||24.7)+(s.tierAdj[tier]||0);return Math.round((1+Math.max(1,c)/100)*1000)/1000;},
 maxDaily(rev,adb){const s=DB.settings.limits;if(!(rev>0))return 0;const d=rev/21,cap=d*s.base/100+(adb>0?adb*s.adb/100:0);return s.ceil>0?Math.min(d*s.ceil/100,cap):cap;},
 maxApproval(m,T,f,tier){const md=Engine.maxDaily(m.revenue,m.adb)-Engine.obligationsDaily(m);if(md<=0)return 0;return Math.floor(md*PER[f]*Engine.nPay(T,f)/Engine.factor(tier||'B',T)/1000)*1000;},
 obligationsDaily(m){return(m.positions||[]).filter(p=>p.balance>0).reduce((a,p)=>a+(p.freq==='weekly'?p.payment/5:p.payment),0);},
 quote(o){const n=Engine.nPay(o.term,o.freq),pay=o.amount*o.factor,pm=n?pay/n:0,fee=o.amount*(o.feePct||0)/100,com=o.amount*(o.commissionPct||0)/100,net=o.amount-fee;
  return{n,payback:pay,payment:pm,fee,commission:com,net,apr:o.amount>0?Engine.solve(net,pm,n)*PPY[o.freq]:0};},
 risk(m){const w=DB.settings.weights,f=[];const add=(l,v,note)=>f.push({label:l,pts:Math.round(v),note});
  const yrs=m.tibMonths/12;add('Time in business',Math.min(1,yrs/8)*w.tib,yrs.toFixed(1)+' years');
  add('Revenue level',Math.min(1,Math.log10(Math.max(1,m.revenue/10000))/1.6)*w.revenue,money(m.revenue)+' a month');
  const cash=m.revenue?m.adb/m.revenue:0;add('Cash position',Math.min(1,cash/0.25)*w.cash,pct(cash)+' ADB ÷ revenue');
  add('Negative days',-Math.min(16,m.negDays)*w.negDays,m.negDays+' in 90 days');
  add('NSFs',-Math.min(10,m.nsfs)*w.nsf,m.nsfs+' in 90 days');
  const pos=(m.positions||[]).filter(p=>p.balance>0).length;add('Open positions',-Math.min(4,pos)*w.positions,pos+' open');
  const ir=INDUSTRY[m.industry]||'M';add('Industry risk',ir==='L'?w.industry:ir==='H'?-w.industry*1.3:0,m.industry+' ('+{L:'low',M:'medium',H:'high'}[ir]+')');
  add('Revenue trend',Math.max(-1,Math.min(1,m.trend/0.15))*w.trend,(m.trend>=0?'+':'')+pct(m.trend)+' over 6 months');
  add('Revenue volatility',-Math.min(1,m.volatility/0.35)*w.volatility,pct(m.volatility)+' month-to-month');
  const holdback=m.revenue?Engine.obligationsDaily(m)/(m.revenue/21):0;
  const flags=[];if(m.nsfs>=8)flags.push('High NSF count');if(m.negDays>=10)flags.push('Frequent negative days');if(holdback>0.25)flags.push('Debt load above 25% of daily revenue');if(pos>=3)flags.push('Stacked: 3+ positions');
  const score=Math.max(300,Math.min(850,Math.round(640+f.reduce((a,x)=>a+x.pts,0))));const c=DB.settings.tierCut;
  return{score,tier:score>=c.A?'A':score>=c.B?'B':score>=c.C?'C':score>=c.D?'D':'E',factors:f,holdback,flags};},
 /* servicing math from the payment ledger */
 deal(d){const paid=d.payments.filter(p=>p.status==='paid').reduce((a,p)=>a+p.amount,0),bal=Math.max(0,d.payback-paid);
  const fails=d.payments.filter(p=>p.status==='failed');const lastOk=[...d.payments].reverse().find(p=>p.status==='paid');const lastFail=[...fails].pop();
  let streak=0;for(let i=d.payments.length-1;i>=0;i--){if(d.payments[i].status==='failed')streak++;else break;}
  const firstMissed=streak?d.payments[d.payments.length-streak].date:null,late=firstMissed?daysBetween(firstMissed,todayISO)+1:0;   /* a missed payment counts as late from that day */
  let status=d.status==='Renewed'?'Renewed':bal<=0.5?'Paid Off':d.defaulted?'Default':late>30?'Default':late>7?'Delinquent':late>0?'Late':'Current';
  const made=d.payments.filter(p=>p.status==='paid').length,rem=Math.max(0,Math.ceil(bal/d.payment-1e-9));
  return{paid,balance:bal,progress:d.payback?paid/d.payback:0,status,late,lastOk:lastOk&&lastOk.date,lastFail:lastFail&&lastFail.date,fails:fails.length,made,remaining:rem,daysActive:daysBetween(d.fundedDate,todayISO)};},
 renewal(d){const s=Engine.deal(d),r=DB.settings.renewal,recentFail=d.payments.some(p=>p.status==='failed'&&daysBetween(p.date,todayISO)<=r.cleanDays);
  const m=Store.get('merchants',d.merchantId),eligible=s.status==='Current'&&s.progress>=r.minPaid&&!recentFail;
  const suggest=Math.round(d.amount*(1+Math.max(-0.2,Math.min(0.3,m.trend)))*(s.fails?0.9:1.1)/5000)*5000;
  return{eligible,progress:s.progress,suggest,reason:eligible?'Eligible now':s.status!=='Current'?'Account is '+s.status.toLowerCase():recentFail?'Failed payment in last '+r.cleanDays+' days':'At '+pct(s.progress,0)+' paid; eligible at '+pct(r.minPaid,0)};},
 revenueOf(d){const share=1-1/d.factor;return d.payments.filter(p=>p.status==='paid').map(p=>({date:p.date,amount:p.amount*share}));}
};

/* ---------- realistic fictional demo data (clearly labeled) ---------- */
const Seed={build(){
 const R=rng(20261007),pick=a=>a[Math.floor(R()*a.length)],between=(a,b)=>a+R()*(b-a),int=(a,b)=>Math.floor(between(a,b+1));
 const users=[['Jack Rivera','admin@pop.demo','admin'],['Dana Whitfield','exec@pop.demo','executive'],['Marcus Chen','uw@pop.demo','underwriter'],['Priya Nair','uw2@pop.demo','underwriter'],['Sofia Alvarez','sales@pop.demo','sales'],['Tyler Brooks','sales2@pop.demo','sales'],['Ken Okafor','ops@pop.demo','operations'],['Rachel Stone','collect@pop.demo','collections']].map((u,i)=>({id:'u'+(i+1),name:u[0],email:u[1],pass:'demo123',role:u[2],active:true}));
 const reps=users.filter(u=>u.role==='sales'||u.role==='admin');

  DB.merchants.filter(scope).forEach(m=>{if(hit(m.dba,m.legal,m.ein,m.owner.phone,m.owner.email,m.owner.name,m.address,m.id,brokerName(m.brokerId)))g.Merchants.push({t:m.dba,s:m.legal+' · '+m.city+', '+m.state,h:'#/m/'+m.id});

App.render=function(){
 const u=App.session();if(!u){App.user=null;return renderLogin();}App.user=u;
 const h=(location.hash||'#/').replace(/^#\/?/,''),parts=h.split('/'),page=parts[0]||'';
 if(u.role==='customer')return App.shell(CUSTNAV,(CustPages[page]||CustPages.home)(),page||'home','customer');
 if(u.role==='broker'){const p=page||'bdash';const f=BrkPages[p]||(p==='m'?()=>App.pages.m(parts[1],parts[2]):BrkPages.bdash);return App.shell(BRKNAV,f(parts[1]),p,'broker');}
 const r=ROUTES[page]||ROUTES.dash,key=ROUTES[page]?page:'dash';let html;
 const allowed=r[1]==='deal'?(can('servicing')||can('collections')||can('funding')||can('payments')):can(r[1]);
 if(!allowed)html=UI.head([['POP'],['Restricted']],'You don\'t have access to this area','','Ask an admin to update your role in Roles & Permissions.')+UI.empty('This page is hidden for the '+ROLES[u.role].label+' role.');
 else if(key==='uw'&&parts[1])html=App.pages.uwd(parts[1]);else html=App.pages[r[0]](parts[1],parts[2]);
 App.shell(null,html,key,'crm');};
App.session=function(){try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');const u=s&&DB.users.find(x=>x.id===s.u&&x.active!==false);return u||null;}catch(e){return null;}};
App.shell=function(nav,content,active,kind){
 const u=App.user,unread=kind==='crm'?Notif.unread():0,col=App.collapsed&&kind==='crm';let side='';

 else side='<div class="ng">'+nav.map(i=>'<a href="#/'+i[0]+'" class="'+(active===i[0]||(active==='bdeal'&&i[0]==='bdeals')?'on':'')+'">'+ic(i[2])+'<span>'+i[1]+'</span></a>').join('')+'</div>';
 const top='<header class="top"><button class="icon-btn mnav" data-act="drawer" aria-label="Menu">'+ic('menu')+'</button>'+(kind==='crm'?'<button class="gsbtn" data-act="search">'+ic('search')+'<span>Search merchants, deals, IDs</span><kbd>⌘K</kbd></button>':'<span class="pname">'+(kind==='broker'?'Broker portal':'My Portal')+'</span>')+'<span class="grow"></span><span class="demo-b" title="All records are fictional demo data">DEMO DATA</span>'+
  (kind==='crm'?'<details class="um qc"><summary class="icon-btn" aria-label="Create new">'+ic('plus')+'</summary><div class="menu">'+(canEdit('leads')?'<button data-act="newlead">New lead</button>':'')+(canEdit('applications')?'<button data-act="newapp">New application</button>':'')+'<button data-act="newtask">New task</button>'+(can('communications')?'<button data-act="compose">New message</button>':'')+'</div></details>':'')+(kind==='crm'?'<div class="bellw"><button class="icon-btn" data-act="bell" aria-label="Notifications, '+unread+' unread">'+ic('bell')+(unread?'<em>'+unread+'</em>':'')+'</button></div>':'')+
  '<details class="um"><summary><span class="av">'+esc(u.name.split(' ').map(x=>x[0]).join('').slice(0,2))+'</span><span class="umn"><b>'+esc(u.name)+'</b><small>'+(ROLES[u.role]?ROLES[u.role].label:u.role==='broker'?'Broker':'Customer')+'</small></span></summary><div class="menu"><button data-act="shortcuts">Keyboard shortcuts</button><button data-act="logout">'+ic('out')+'Sign out</button></div></details></header>';
 const sideHtml='<aside class="side'+(col?' col':'')+'"><div class="brand"><img src="'+LOGO_IMG+'" alt="Pop Funding Inc"><span>'+(kind==='crm'?'OS':kind==='broker'?'Brokers':'')+'</span></div><nav aria-label="Main">'+side+'</nav>'+(kind==='crm'?'<button class="collapse" data-act="collapse" aria-label="'+(col?'Expand':'Collapse')+' sidebar">'+ic('chev')+'<span>Collapse</span></button>':'<div class="help">Need help?<br><a href="mailto:support@pop.demo">Contact support →</a></div>')+'</aside>';
 const prev=$('#main'),sameRoute=App._last===location.hash;
 $('#app').innerHTML='<div class="shell k-'+kind+(col?' col':'')+'">'+sideHtml+'<div class="body">'+top+'<main id="main" tabindex="-1">'+content+'</main></div></div><div class="scrim" data-act="drawer"></div>';
 if(!sameRoute){window.scrollTo(0,0);App._last=location.hash;}document.title=(($('#main h1')||{}).textContent||'POP')+' · POP';};
window.addEventListener('hashchange',()=>{document.body.classList.remove('drawer');App.render();});

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
 const close=e.target.closest('[data-close]');if(close&&!e.target.closest('[data-mact]')){if(close.tagName==='A'){UI.close();return;}UI.close();return;}
 if(e.target.id==='modal'){UI.close();return;}
 const ma=e.target.closest('[data-mact]');if(ma){const a=UI._acts[+ma.dataset.mact];if(a&&a.run()!==false)UI.close();return;}
 const act=e.target.closest('[data-act]');if(act){const n=act.dataset.act;
  if(n==='tab'){App.tabsState[act.dataset.tabs]=act.dataset.v;App.render();return;}
  if(n==='range'){App.range.k=act.dataset.v;App.render();return;}
  if(n==='rangeapply'){const f=$('#rf').value,t=$('#rt').value;if(!f||!t||f>t){UI.toast('Choose a valid date range','error');return;}App.range.from=f;App.range.to=t;App.render();return;}
  if(n==='export'){Table.csv(act.dataset.t);return;}
  if(n==='saveview'){const id=act.dataset.t,s=Table.st(id);UI.modal('Save view',UI.field('svN','Name','My view'),[{label:'Cancel',run:()=>true},{label:'Save',primary:1,run:()=>{if(!UI.v('svN'))return false;DB.views[id]=(DB.views[id]||[]).concat({name:UI.v('svN'),q:s.q,f:Object.assign({},s.f),sort:s.sort});Store.save();Table.refresh(id);UI.toast('View saved');return true;}}]);return;}
  if(n==='bulk'){const id=act.dataset.t,s=Table.st(id),b=App.tables[id].bulk[+act.dataset.i],ids=[...s.sel];UI.confirm(b.label+' for '+ids.length+' record(s)?',()=>{b.run(ids);s.sel.clear();Store.save();UI.toast(b.label+': '+ids.length+' done');App.render();},b.label);return;}
  if(n==='bulkclear'){Table.st(act.dataset.t).sel.clear();Table.refresh(act.dataset.t);return;}
  if(n==='search'){Search.open();return;}
  if(n==='collapse'){App.collapsed=!App.collapsed;localStorage.setItem('pop_nav_c',App.collapsed?'1':'0');App.render();return;}
  if(n==='drawer'){document.body.classList.toggle('drawer');return;}
  if(n==='logout'){localStorage.removeItem(SKEY);App.user=null;location.hash='#/';App.render();return;}
  if(n==='shortcuts'){showShortcuts();return;}
  if(n==='bell'){const list=Notif.list().slice(0,8);const w=act.parentNode;const old=w.querySelector('.bellm');if(old){old.remove();return;}w.insertAdjacentHTML('beforeend','<div class="bellm"><div class="bh"><b>Notifications</b><button class="linkbtn" data-act="readall">Mark all read</button></div>'+(list.length?list.map(x=>'<a href="'+(x.link||'#/notifications')+'" class="'+(x.read?'':'unread')+'" data-nid="'+x.id+'">'+esc(x.text)+'<small>'+ago(x.ts)+'</small></a>').join(''):'<p class="muted">You\'re all caught up.</p>')+'<a class="all" href="#/notifications">View all</a></div>');return;}
  const f=App.acts[n];if(f){e.preventDefault();f(act);}return;}
 const nl=e.target.closest('[data-nid]');if(nl){const x=DB.notifications.find(z=>z.id===nl.dataset.nid);if(x){x.read=true;Store.save();}if(nl.dataset.nid==='sys-od')DB.views._readOD=true;if(nl.dataset.nid==='sys-md')DB.views._readMD=true;}
 const row=e.target.closest('[data-href]');if(row&&!e.target.closest('a,button,input,select,label,textarea')){location.hash=row.dataset.href;}
 if(!e.target.closest('.bellw')){const bm=$('.bellm');if(bm)bm.remove();}
 if(!e.target.closest('details.um,details.colsel'))$$('details.um[open],details.colsel[open]').forEach(d=>d.open=false);
});
let gKey=0;
document.addEventListener('keydown',e=>{if(!App.user||App.user.role==='customer')return;const typing=/input|textarea|select/i.test(e.target.tagName);
 if(e.key==='Escape'&&!$('#modal').hidden){UI.close();return;}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();Search.open();return;}
 if(typing||!$('#modal').hidden)return;
 if(e.key==='/'){e.preventDefault();Search.open();return;}if(e.key==='?'){showShortcuts();return;}
 if(e.key==='g'){gKey=Date.now();return;}
 if(Date.now()-gKey<900){const map={d:'dash',l:'leads',a:'apps',p:'pipeline',u:'uw',f:'funding',m:'merchants',c:'collections',t:'tasks',r:'reports',n:'notifications'};if(map[e.key]){location.hash='#/'+map[e.key];gKey=0;}}
 if(e.key==='n'&&can('leads')&&canEdit('leads'))App.acts.newlead();});
function showShortcuts(){UI.modal('Keyboard shortcuts','<table class="mini">'+[['/ or ⌘K','Search everything'],['?','This list'],['g then d','Dashboard'],['g then l','Leads'],['g then a','Applications'],['g then p','Pipeline'],['g then u','Underwriting'],['g then f','Funding'],['g then m','Merchants'],['g then c','Collections'],['g then t','Tasks'],['g then r','Reports'],['n','New lead'],['Esc','Close dialog']].map(x=>'<tr><td><kbd>'+x[0]+'</kbd></td><td>'+x[1]+'</td></tr>').join('')+'</table>',[{label:'Close',run:()=>true}]);}

/* ---------- sign-in (3D logo stage, team / broker / customer) ---------- */
var LOGIN_ROLE='team';
const DEMO={team:[['Admin','admin@pop.demo'],['Executive','exec@pop.demo'],['Underwriter','uw@pop.demo'],['Sales','sales@pop.demo'],['Operations','ops@pop.demo'],['Collections','collect@pop.demo']],broker:[['Broker (Atlas Funding Group)','broker@atlas.demo']],customer:[['Customer with active funding','owner@pop.demo'],['Applicant with offers','applicant@pop.demo']]};
function renderLogin(){
 const now=new Date(),d=(now.getMonth()+1)+'/'+now.getDate()+'/'+now.getFullYear();
 $('#app').innerHTML='<div class="tc">'+
  '<div class="tc-top"><span id="tcDate">'+d+'</span><span id="tcTime" aria-label="Current time"></span></div>'+
  '<div class="tc-stage"><div class="spin" id="spin" role="img" aria-label="Pop Funding logo in 3D. Drag in any direction to spin it."><div class="tile" id="tile">'+
   Array.apply(null,{length:SLICES}).map(function(_,i){return '<div class="sl'+(i===0||i===SLICES-1?' face':'')+'"></div>';}).join('')+'</div></div></div>'+
  '<nav class="tc-links roles" role="group" aria-label="Sign in as">'+[['team','Team'],['broker','Brokers'],['customer','Customers']].map(r=>'<button type="button" data-role="'+r[0]+'" aria-pressed="'+(r[0]===LOGIN_ROLE)+'">'+r[1]+'</button>').join('')+'</nav>'+
  '<form id="loginForm" class="tc-form" novalidate><label class="sr" for="lEmail">Email</label><input class="tc-in" id="lEmail" type="email" placeholder="Email" autocomplete="username" required>'+
  '<label class="sr" for="lPass">Password</label><input class="tc-in" id="lPass" type="password" placeholder="Password" autocomplete="current-password" required>'+
  '<button class="tc-go" type="submit">Sign in</button><p class="tc-err err" id="lErr" role="alert"></p></form>'+
  '<p class="tc-copy">POP Funding Inc. Business funding, from first call to funded.</p>'+
  '<div class="tc-home"><button type="button" id="tcInfoBtn" aria-expanded="false" aria-controls="tcInfo">Info</button></div>'+
  '<div class="tc-info" id="tcInfo" hidden><b>Demo accounts</b> (password demo123)<br>'+DEMO[LOGIN_ROLE].map((x,i)=>'<button type="button" class="demo-acct" data-email="'+x[1]+'"'+(i===0?' id="fillDemo"':'')+'>'+x[0]+'<small>'+x[1]+'</small></button>').join('')+'<span style="color:#777">Demo build: data is fictional and saved in this browser only.</span></div></div>';
 const tick=()=>{const t=new Date(),el=$('#tcTime');if(!el){clearInterval(CLOCK);CLOCK=null;return;}el.textContent=[t.getHours(),t.getMinutes(),t.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');};
 tick();clearInterval(CLOCK);CLOCK=setInterval(tick,1000);startSpin();stopGL();if(hasWebGL())loadThree(startGL);
 $$('.tc-links button').forEach(b=>b.onclick=()=>{LOGIN_ROLE=b.dataset.role;const open=!$('#tcInfo').hidden;renderLogin();if(open){$('#tcInfo').hidden=false;$('#tcInfoBtn').setAttribute('aria-expanded','true');}});
 $('#tcInfoBtn').onclick=function(){const i=$('#tcInfo');i.hidden=!i.hidden;this.setAttribute('aria-expanded',String(!i.hidden));};
 $$('.demo-acct').forEach(b=>b.onclick=()=>{$('#lEmail').value=b.dataset.email;$('#lPass').value='demo123';$('#tcInfo').hidden=true;});
 $('#loginForm').onsubmit=e=>{e.preventDefault();const em=$('#lEmail').value.trim().toLowerCase(),pw=$('#lPass').value;
  const u=DB.users.find(x=>x.email.toLowerCase()===em&&x.pass===pw&&x.active!==false&&(LOGIN_ROLE==='team'?ROLES[x.role]:x.role===LOGIN_ROLE));
  if(!u){$('#lErr').textContent='That email and password don\'t match a '+(LOGIN_ROLE==='team'?'team':LOGIN_ROLE)+' account.';return;}
  clearInterval(CLOCK);CLOCK=null;stopGL();localStorage.setItem(SKEY,JSON.stringify({u:u.id}));Store.audit('Signed in',u.name,'','');Store.save();location.hash=u.role==='broker'?'#/bdash':u.role==='customer'?'#/home':'#/dash';App.render();};}
function ensureDemoAccounts(){if(DB.users.some(u=>u.role==='customer'))return;
 const funded=DB.deals.find(d=>Engine.deal(d).status==='Current'),offer=DB.applications.find(a=>a.stage==='Offer Sent')||DB.applications.find(a=>a.stage==='Approved');
 if(funded){const m=merch(funded.merchantId);DB.users.push({id:'u10',name:m.owner.name,email:'owner@pop.demo',pass:'demo123',role:'customer',merchantId:m.id,active:true});}
 if(offer){if(offer.stage==='Approved'){if(!offer.offers.length)offer.offers=Biz.defaultOffers(offer);offer.offers.forEach(o=>o.status='Sent');offer.stage='Offer Sent';}else offer.offers.forEach(o=>{if(o.status==='Draft')o.status='Sent';});const m=merch(offer.merchantId);DB.users.push({id:'u11',name:m.owner.name,email:'applicant@pop.demo',pass:'demo123',role:'customer',merchantId:m.id,active:true});}
 Store.save();}
Store.load();ensureDemoAccounts();App.collapsed=localStorage.getItem('pop_nav_c')==='1';App.render();
